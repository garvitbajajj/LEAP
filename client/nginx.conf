# Redirect all plain HTTP traffic to HTTPS while keeping container health checks clean
server {
  listen 80;
  listen [::]:80;
  server_name _;

  location = /health {
    proxy_pass http://server:4000/health;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# TLS 1.2+ reverse proxy and SPA server
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;

  ssl_certificate     /etc/nginx/certs/leap.crt;
  ssl_certificate_key /etc/nginx/certs/leap.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # API and health go to the Express server
  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /health {
    proxy_pass http://server:4000/health;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long-cache fingerprinted assets, never the HTML shell
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths fall back to index.html
  location / {
    try_files $uri /index.html;
  }
}

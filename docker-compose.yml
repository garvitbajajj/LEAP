# LEAP - full stack
#   docker compose up -d --build                  start everything
#   docker compose --profile seed run --rm seed   load the demo data (first run)
#   open https://localhost:8443                   app (HTTPS; :8088 redirects to HTTPS)
#   open https://localhost:8443/api/v1/docs       Swagger
#   open http://localhost:8000/docs               ML service docs

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/leap
      ML_URL: http://ml:8000
      ML_API_KEY: ${ML_API_KEY:-leap-dev-ml-key}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      INTERNAL_BEARER_TOKEN: ${INTERNAL_BEARER_TOKEN:-leap-internal-dev-token}
      CORS_ORIGINS: http://localhost:8088,https://localhost:8443
      CLIENT_URL: https://localhost:8443
      REDIS_URL: redis://redis:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://localhost:8443/api/v1/auth/google/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-LEAP <no-reply@leap.local>}
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Feed cache. Optional for the app: if it is down, recommendations are just computed.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ml:
    build: ./ml
    restart: unless-stopped
    environment:
      ML_API_KEY: ${ML_API_KEY:-leap-dev-ml-key}
      LEAP_API_URL: http://server:4000/api/v1
      LEAP_API_KEY: ${ML_API_KEY:-leap-dev-ml-key}
    ports:
      - "8000:8000"
    volumes:
      - ml-registry:/app/registry

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8088:80"
      - "8443:443"
    depends_on:
      - server

  # One-shot: loads the demo catalogue and accounts. Not started by `up`.
  seed:
    build: ./server
    profiles: ["seed"]
    command: ["node", "src/seed/seed.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/leap
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  ml-registry:

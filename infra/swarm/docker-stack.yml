version: "3.8"

networks:
  leap-net:
    driver: overlay
    attachable: true

volumes:
  mongo-data:
  ml-registry:

secrets:
  ML_API_KEY:
    external: true
  JWT_SECRET:
    external: true
  INTERNAL_BEARER_TOKEN:
    external: true

services:
  mongo:
    image: mongo:7
    networks:
      - leap-net
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

  server:
    image: leap-server:latest
    ports:
      - "4000:4000"
    networks:
      - leap-net
    environment:
      MONGO_URI: mongodb://mongo:27017/leap
      ML_URL: http://ml:8000
      ML_API_KEY_FILE: /run/secrets/ML_API_KEY
      JWT_SECRET_FILE: /run/secrets/JWT_SECRET
      INTERNAL_BEARER_TOKEN_FILE: /run/secrets/INTERNAL_BEARER_TOKEN
      CORS_ORIGINS: "*"
    secrets:
      - ML_API_KEY
      - JWT_SECRET
      - INTERNAL_BEARER_TOKEN
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - mongo
      - ml
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
      restart_policy:
        condition: on-failure

  ml:
    image: leap-ml:latest
    ports:
      - "8000:8000"
    networks:
      - leap-net
    environment:
      ML_API_KEY_FILE: /run/secrets/ML_API_KEY
      LEAP_API_URL: http://server:4000
      LEAP_API_KEY_FILE: /run/secrets/INTERNAL_BEARER_TOKEN
    secrets:
      - ML_API_KEY
    volumes:
      - ml-registry:/app/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 20s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 256M
          cpus: "0.5"
      restart_policy:
        condition: on-failure

  client:
    image: leap-client:latest
    ports:
      - "8080:80"
    networks:
      - leap-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - server
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          memory: 128M
          cpus: "0.1"
      restart_policy:
        condition: on-failure

apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: leap
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: leap
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        app.kubernetes.io/part-of: leap
    spec:
      containers:
        - name: server
          image: leap-server:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: leap-config
            - secretRef:
                name: leap-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: leap
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/part-of: leap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: server
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leap-ingress
  namespace: leap
  labels:
    app.kubernetes.io/part-of: leap
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - leap.example.com
      secretName: leap-tls
  rules:
    - host: leap.example.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 4000
          - path: /ml/
            pathType: Prefix
            backend:
              service:
                name: ml
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80

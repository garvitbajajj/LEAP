apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: leap
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/part-of: leap
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
        app.kubernetes.io/part-of: leap
    spec:
      containers:
        - name: client
          image: leap-client:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: leap
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/part-of: leap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: client
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

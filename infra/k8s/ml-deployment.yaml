apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-registry
  namespace: leap
  labels:
    app.kubernetes.io/name: ml
    app.kubernetes.io/part-of: leap
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
  namespace: leap
  labels:
    app.kubernetes.io/name: ml
    app.kubernetes.io/part-of: leap
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ml
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml
        app.kubernetes.io/part-of: leap
    spec:
      containers:
        - name: ml
          image: leap-ml:latest
          ports:
            - containerPort: 8000
          env:
            - name: ML_API_KEY
              valueFrom:
                secretKeyRef:
                  name: leap-secrets
                  key: ML_API_KEY
            - name: LEAP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: leap-config
                  key: LEAP_API_URL
            - name: LEAP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: leap-secrets
                  key: LEAP_API_KEY
          volumeMounts:
            - name: ml-registry
              mountPath: /app/registry
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "300m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: ml-registry
          persistentVolumeClaim:
            claimName: ml-registry
---
apiVersion: v1
kind: Service
metadata:
  name: ml
  namespace: leap
  labels:
    app.kubernetes.io/name: ml
    app.kubernetes.io/part-of: leap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ml
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP

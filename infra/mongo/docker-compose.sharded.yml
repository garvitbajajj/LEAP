# MongoDB Sharded Cluster for LEAP (configsvr + 2 shards + mongos)
# Usage:
#   docker compose -f infra/mongo/docker-compose.sharded.yml up -d

services:
  configsvr:
    image: mongo:7
    command: ["mongod", "--configsvr", "--replSet", "cfgRs", "--port", "27019", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - cfg-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  config-init:
    image: mongo:7
    depends_on:
      configsvr:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - configsvr:27019
      - --eval
      - "try{rs.status()}catch(e){rs.initiate({_id:'cfgRs',configsvr:true,members:[{_id:0,host:'configsvr:27019'}]})}"
    restart: "no"

  shard1:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "shard1Rs", "--port", "27018", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - shard1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  shard1-init:
    image: mongo:7
    depends_on:
      shard1:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - shard1:27018
      - --eval
      - "try{rs.status()}catch(e){rs.initiate({_id:'shard1Rs',members:[{_id:0,host:'shard1:27018'}]})}"
    restart: "no"

  shard2:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "shard2Rs", "--port", "27018", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - shard2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  shard2-init:
    image: mongo:7
    depends_on:
      shard2:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - shard2:27018
      - --eval
      - "try{rs.status()}catch(e){rs.initiate({_id:'shard2Rs',members:[{_id:0,host:'shard2:27018'}]})}"
    restart: "no"

  mongos:
    image: mongo:7
    command: ["mongos", "--configdb", "cfgRs/configsvr:27019", "--bind_ip_all", "--port", "27017"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    depends_on:
      config-init:
        condition: service_completed_successfully
      shard1-init:
        condition: service_completed_successfully
      shard2-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  shard-init:
    image: mongo:7
    depends_on:
      mongos:
        condition: service_healthy
    volumes:
      - ./init-sharding.js:/scripts/init-sharding.js:ro
    entrypoint: ["mongosh", "--host", "mongos:27017", "/scripts/init-sharding.js"]
    restart: "no"

volumes:
  cfg-data:
  shard1-data:
  shard2-data:

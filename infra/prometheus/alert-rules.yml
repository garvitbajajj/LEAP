# Alerting rules for LEAP Platform
groups:
  - name: leap_alerts
    rules:
      # 1. High request latency – p95 above 500ms for 5 minutes
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency detected"
          description: "95th percentile request latency is above 500ms for the last 5 minutes (current value: {{ $value }}s)."

      # 2. High error rate – 5xx responses exceed 5% of total
      - alert: HighErrorRate
        expr: >
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
          /
          sum(rate(http_request_duration_seconds_count[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of requests are returning 5xx status codes (current value: {{ $value | humanizePercentage }})."

      # 3. ML model not fitted
      - alert: MLModelNotFitted
        expr: ml_model_fitted == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ML model is not fitted"
          description: "The ML recommendation model has not been fitted for at least 2 minutes. Recommendations will use fallback logic."

      # 4. High recommendation fallback rate
      - alert: HighRecommendationFallbackRate
        expr: rate(leap_recommendation_fallback_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High recommendation fallback rate"
          description: "Recommendation fallback rate exceeds 0.1 per second (current value: {{ $value }}/s)."

      # 5. Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

      # 6. High memory usage – above 512 MB
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes > 536870912
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "Process resident memory on {{ $labels.instance }} is above 512MB (current value: {{ $value | humanize1024 }}B)."
